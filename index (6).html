<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>html,body{background:#0d0a0a;margin:0}</style>
<title>Лента призов Ронин</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
/* Лента призов в духе открытия кейса: указатель по центру, карточки проезжают под ним */
:root{
  --bg:#0d0a0a;
  --card:#1a1313;
  --card-2:#241a1a;
  --line:#332626;
  --fg:#f4ece9;
  --dim:#9a8883;
  --acc:#d8232a;
  --acc-hot:#ff4b45;
  --gold:#e8b23a;
  --font-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);overscroll-behavior:none}
body{
  font-family:var(--font-body);color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 32px;
  display:flex;flex-direction:column;align-items:center;gap:0;
  min-height:100vh;
}
h1{
  font-family:var(--font-display);font-weight:700;font-size:22px;
  letter-spacing:4px;margin:0;text-transform:uppercase;
}
.sub{color:var(--dim);font-size:13px;margin:6px 0 22px;text-align:center;max-width:320px;line-height:1.5;min-height:20px}

.stage{position:relative;width:100%;max-width:420px;margin-bottom:24px}
.viewport{
  position:relative;overflow:hidden;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#120d0d,#1a1313 50%,#120d0d);
  padding:14px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);
}
#strip{display:flex;gap:8px;will-change:transform}
.card{
  flex:0 0 120px;height:140px;border-radius:10px;
  background:var(--card-2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:8px 6px;position:relative;overflow:hidden;
}
.card .glyph{
  position:absolute;top:0;left:0;right:0;height:86px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:26px;
  letter-spacing:1px;opacity:.9;
}
.card .name{
  font-size:11.5px;line-height:1.25;text-align:center;
  color:var(--fg);position:relative;z-index:1;
}
.card .bar{position:absolute;left:0;right:0;bottom:0;height:3px}
.r1{background:linear-gradient(180deg,#2a1d1d,#1c1414)}
.r1 .bar{background:#6b4a4a}
.r1 .glyph{color:#8d6f6f}
.r2{background:linear-gradient(180deg,#3a1a1a,#231212)}
.r2 .bar{background:var(--acc)}
.r2 .glyph{color:#e0675f}
.r3{background:linear-gradient(180deg,#4a1512,#2a0f0e)}
.r3 .bar{background:var(--acc-hot)}
.r3 .glyph{color:#ff7a70}
.r4{background:linear-gradient(180deg,#4a3410,#2a1d08)}
.r4 .bar{background:var(--gold)}
.r4 .glyph{color:var(--gold)}

.pin{position:absolute;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none}
.pin.top{top:-1px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--gold);width:0;height:0}
.pin.bot{bottom:-1px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--gold);width:0;height:0}
.pin.line{top:0;bottom:0;width:1px;background:linear-gradient(180deg,var(--gold),transparent 20%,transparent 80%,var(--gold));opacity:.5}

.panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
button{
  width:100%;height:54px;border:0;border-radius:12px;cursor:pointer;
  background:var(--acc);color:#fff;
  font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:1px;
  text-transform:uppercase;transition:background .15s;
}
button:hover,button:active{background:var(--acc-hot)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{color:var(--dim);font-size:12px;text-align:center;margin:0;line-height:1.5}
.err{color:#ff8a70;font-size:13px;text-align:center;margin:0;line-height:1.5}
.err:empty,.hint:empty{display:none}

.result{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px;text-align:center;
}
.result .label{color:var(--dim);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:0 0 8px}
.result .prize{font-family:var(--font-display);font-weight:700;font-size:21px;margin:0 0 6px;line-height:1.2}
.result .meta{color:var(--dim);font-size:13px;margin:0}
.result .code{font-family:var(--font-display);font-weight:700;font-size:44px;letter-spacing:10px;
              text-indent:10px;color:var(--gold);margin:2px 0 4px;line-height:1.1}

.odds{width:100%;max-width:420px;margin-top:28px}
.odds h2{font-family:var(--font-display);font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0 0 10px}
.odds ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:6px}
.odds li{font-size:14.5px;line-height:1.3;background:var(--card);border-radius:8px;padding:10px 12px;border-left:2px solid var(--line)}

[hidden]{display:none!important}

/* карточки с фото: квадратное фото, подпись по центру своей полосы */
#strip{gap:10px}
.card{flex:0 0 140px;height:182px;transition:opacity .4s ease,box-shadow .4s ease,transform .4s ease,border-color .4s ease}
.card .glyph{height:140px}
.card .glyph.pic{box-shadow:inset 0 -24px 22px -16px rgba(0,0,0,.65)}
.card .name{position:absolute;left:6px;right:6px;top:140px;bottom:3px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
#strip.stopped .card{opacity:.42}
#strip.stopped .card.win{opacity:1;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 28px -6px var(--gold);transform:scale(1.04)}

@media (prefers-reduced-motion: reduce){
  #strip{transition:none !important}
}
</style>
</head>
<body>

<h1>Ронин</h1>
<p class="sub" id="sub">Загружаем…</p>

<div class="stage">
  <div class="pin top"></div>
  <div class="pin line"></div>
  <div class="pin bot"></div>
  <div class="viewport" id="viewport"><div id="strip"></div></div>
</div>

<div class="panel">
  <button id="go" hidden>Сканировать чек</button>
  <p class="hint" id="hint"></p>
  <p class="err" id="err"></p>

  <div class="result" id="prizeBox" hidden>
    <p class="label" id="pLabel">Выпало</p>
    <p class="prize" id="pName"></p>
    <p class="meta" id="pMeta"></p>
  </div>

  <div class="result" id="codeBox" hidden>
    <p class="label">Назови код администратору</p>
    <p class="code" id="codeVal"></p>
    <p class="meta" id="codeTimer"></p>
  </div>
</div>

<div class="odds">
  <h2>Что можно выиграть</h2>
  <ul id="odds"></ul>
</div>

var WIN_AT = 58;     // позиция выигрышной карточки в ленте
var TOTAL  = 68;

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0d0a0a'); tg.setBackgroundColor('#0d0a0a'); } catch (e) {}
}

var strip = document.getElementById('strip');
var btn   = document.getElementById('go');
var sub   = document.getElementById('sub');
var hint  = document.getElementById('hint');
var errEl = document.getElementById('err');
var mode  = '';          // 'spin' | 'visit' | 'redeem'
var busy  = false;
var tick  = null;        // обратный отсчёт кода
var poll  = null;        // опрос статуса, пока показан код

/* ---------- сеть ---------- */
function jsonp(url) {
  return new Promise(function (res, rej) {
    var cb = 'cb' + Date.now() + Math.floor(Math.random() * 1000);
    var sc = document.createElement('script');
    var t  = setTimeout(function () { done(); rej(new Error('timeout')); }, 20000);
    function done() { clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = function (d) { done(); res(d); };
    sc.src = url + '&callback=' + cb;
    sc.onerror = function () { done(); rej(new Error('network')); };
    document.body.appendChild(sc);
  });
}
function api(action, extra) {
  return jsonp(API + '?action=' + action +
    '&initData=' + encodeURIComponent(tg ? tg.initData : '') + (extra || ''));
}

/* ---------- лента ---------- */
function pick() {
  var total = 0, i;
  for (i = 0; i < PRIZES.length; i++) total += PRIZES[i].w;
  var r = Math.random() * total, acc = 0;
  for (i = 0; i < PRIZES.length; i++) {
    acc += PRIZES[i].w;
    if (r < acc) return i;
  }
  return PRIZES.length - 1;
}

function cardHtml(p, i) {
  return '<div class="card r' + p.r + '">' +
           '<div class="glyph pic ph' + i + '"></div>' +
           '<div class="name">' + p.name + '</div>' +
           '<div class="bar"></div>' +
         '</div>';
}

function buildStrip(winIdx) {
  var html = '', prev = -1;
  for (var i = 0; i < TOTAL; i++) {
    var idx;
    if (i === WIN_AT) {
      idx = winIdx;
    } else {
      // без одинаковых соседей и без двойника слева от выигрыша
      var guard = 0;
      do { idx = pick(); guard++; }
      while (guard < 40 && (idx === prev || (i === WIN_AT - 1 && idx === winIdx)));
    }
    html += cardHtml(PRIZES[idx], idx);
    prev = idx;
  }
  strip.innerHTML = html;
}

function resetStrip() {
  strip.classList.remove('stopped');
  strip.style.transition = 'none';
  strip.style.transform = 'translateX(0px)';
  strip.offsetHeight;
}

function runStrip(winIdx, after) {
  resetStrip();
  buildStrip(winIdx);

  var center = document.getElementById('viewport').offsetWidth / 2;
  var jitter = (Math.random() * 2 - 1) * (CARD * 0.28);
  var x = -(WIN_AT * CARD + CARD / 2 - center + jitter);

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dur = reduced ? 0 : 5200;

  requestAnimationFrame(function () {
    strip.style.transition = dur ? 'transform ' + dur + 'ms cubic-bezier(.11,.72,.17,1)' : 'none';
    strip.style.transform = 'translateX(' + x + 'px)';
  });

  setTimeout(function () {
    var w = strip.children[WIN_AT];
    if (w) w.classList.add('win');
    strip.classList.add('stopped');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    after();
  }, dur + 120);
}

/* ---------- экраны ---------- */
function $(id) { return document.getElementById(id); }
function setBtn(text, visible) {
  btn.textContent = text;
  btn.hidden = !visible;
  btn.disabled = false;
}
function clearTick() { if (tick) { clearInterval(tick); tick = null; } }
function clearPoll() { if (poll) { clearInterval(poll); poll = null; } }

function showPrize(label, name, meta) {
  $('pLabel').textContent = label;
  $('pName').textContent = name;
  $('pMeta').textContent = meta;
  $('prizeBox').hidden = false;
}

function render(st) {
  errEl.textContent = '';
  $('codeBox').hidden = true;
  clearTick();
  clearPoll();

  if (st.prize) {
    showPrize('Твой приз', st.prize, 'Действует до ' + st.expires);
    sub.textContent = 'Приз ждёт тебя';
    if (st.canRedeem) {
      mode = 'redeem';
      setBtn('Забрать приз', true);
      hint.textContent = 'Отсканируй чек, который пробили сегодня. Тот, по которому крутил, не подойдёт';
    } else {
      mode = '';
      setBtn('', false);
      hint.textContent = st.reason || 'Забрать можно со следующего визита';
    }
    return;
  }

  $('prizeBox').hidden = true;

  if (st.canSpin && st.visit) {
    mode = 'visit';
    sub.textContent = 'Приз выдан — крути за новым';
    setBtn('Крутить ленту', true);
    hint.textContent = 'Чек этого визита уже засчитан, сканировать не нужно';
  } else if (st.canSpin) {
    mode = 'spin';
    sub.textContent = 'Отсканируй чек и крути ленту';
    setBtn('Сканировать чек', true);
    hint.textContent = 'QR-код внизу кассового чека';
  } else {
    mode = '';
    sub.textContent = 'Приходи ещё';
    setBtn('', false);
    hint.textContent = st.reason || 'Следующая попытка позже';
  }
}

function showCode(code, secs) {
  $('prizeBox').hidden = true;
  setBtn('', false);
  hint.textContent = '';
  sub.textContent = 'Покажи код администратору';
  $('codeVal').textContent = code;
  $('codeBox').hidden = false;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

  var left = secs;
  var el = $('codeTimer');
  function paint() {
    if (left <= 0) { el.textContent = 'Код истёк, запроси заново'; clearTick(); load(); return; }
    var m = Math.floor(left / 60), s = left % 60;
    el.textContent = 'Действует ещё ' + m + ':' + ('0' + s).slice(-2);
    left--;
  }
  paint();
  clearTick();
  tick = setInterval(paint, 1000);

  // ждём, пока администратор погасит приз, и сразу предлагаем крутить
  clearPoll();
  poll = setInterval(function () {
    api('status').then(function (r) {
      if (r && r.ok && !r.prize) {
        clearPoll(); clearTick();
        render(r);
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      }
    }).catch(function () {});
  }, 8000);
}

/* ---------- действия ---------- */
// Открыто кнопкой из нижней клавиатуры: Telegram не передаёт данные гостя.
function showWrongEntry() {
  $('prizeBox').hidden = true;
  errEl.textContent = '';
  sub.textContent = 'Открой ленту синей кнопкой';
  hint.textContent = 'В чате с ботом нажми синюю кнопку «Колесо» слева от поля ввода.';
  if (tg && tg.sendData && tg.platform && tg.platform !== 'unknown') {
    mode = 'fix';
    setBtn('Прислать рабочую кнопку', true);
  } else {
    mode = '';
    setBtn('', false);
  }
}

function load() {
  if (!tg || !tg.initData) { showWrongEntry(); return; }
  api('status').then(function (r) {
    if (!r.ok) { sub.textContent = ''; errEl.textContent = r.error || 'Ошибка'; setBtn('', false); hint.textContent = ''; return; }
    render(r);
  }).catch(function () {
    sub.textContent = '';
    errEl.textContent = 'Нет связи. Закрой и открой страницу заново.';
    setBtn('', false);
  });
}

// qr === null — прокрут по чеку визита, без сканирования
function doSpin(qr) {
  var again = (qr === null) ? 'Крутить ленту' : 'Сканировать чек';
  busy = true; btn.disabled = true; btn.textContent = 'Крутим'; errEl.textContent = '';
  $('prizeBox').hidden = true;
  var req = (qr === null) ? api('spinVisit') : api('spin', '&qr=' + encodeURIComponent(qr));
  req.then(function (r) {
    if (!r.ok) { errEl.textContent = r.error || 'Не получилось'; busy = false; setBtn(again, true); return; }
    runStrip(r.index, function () {
      busy = false;
      showPrize('Выпало', r.prize, 'Забрать со следующего визита, до ' + r.expires);
      setBtn('', false);
      sub.textContent = 'Приз твой';
      hint.textContent = 'Понадобится чек следующего визита';
    });
  }).catch(function () {
    errEl.textContent = 'Нет связи с сервером.'; busy = false; setBtn(again, true);
  });
}

function doRedeem(qr) {
  busy = true; btn.disabled = true; btn.textContent = 'Проверяем чек'; errEl.textContent = '';
  api('redeem', '&qr=' + encodeURIComponent(qr)).then(function (r) {
    busy = false;
    if (!r.ok) { errEl.textContent = r.error || 'Не получилось'; setBtn('Забрать приз', true); return; }
    showCode(r.code, r.seconds || 900);
  }).catch(function () {
    errEl.textContent = 'Нет связи с сервером.'; busy = false; setBtn('Забрать приз', true);
  });
}

btn.onclick = function () {
  if (busy || !mode) return;
  errEl.textContent = '';
  if (mode === 'fix') { tg.sendData('fix'); return; }   // бот пришлёт рабочую кнопку, лента закроется
  if (!tg || !tg.initData) { showWrongEntry(); return; }
  if (mode === 'visit') { doSpin(null); return; }
  if (!tg.showScanQrPopup) { errEl.textContent = 'Обнови Telegram — нужен сканер QR.'; return; }
  var m = mode;
  tg.showScanQrPopup({ text: 'QR-код внизу кассового чека' }, function (qr) {
    if (!qr) return false;
    if (tg.closeScanQrPopup) tg.closeScanQrPopup();
    if (m === 'spin') doSpin(qr); else doRedeem(qr);
    return true;
  });
};

/* ---------- список призов ---------- */
(function initList() {
  var colors = { 1: '#6b4a4a', 2: '#d8232a', 3: '#ff4b45', 4: '#e8b23a' };
  var html = '';
  for (var i = 0; i < PRIZES.length; i++) {
    html += '<li style="border-left-color:' + colors[PRIZES[i].r] + '">' + PRIZES[i].name + '</li>';
  }
  $('odds').innerHTML = html;
})();

buildStrip(pick());
load();
</script>
</body>
</html>
