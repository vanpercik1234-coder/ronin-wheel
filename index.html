<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Колесо Ronin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#12100e;--card:#1c1917;--line:#2f2a26;--fg:#f0ece6;--dim:#8d857c;--acc:#c9a227}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px;min-height:100vh}
h1{font-size:20px;font-weight:500;margin:0 0 4px;letter-spacing:.5px}
.sub{color:var(--dim);font-size:13px;margin:0 0 20px;text-align:center;max-width:300px}
.wrap{position:relative;width:min(340px,88vw)}
.pin{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:3;
     border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--acc)}
svg{display:block;width:100%;height:auto}
#rotor{transform-origin:170px 170px;transition:transform 5s cubic-bezier(.16,.9,.26,1)}
.panel{width:min(340px,88vw);margin-top:22px}
input{width:100%;height:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;
      color:var(--fg);font-size:18px;text-align:center;letter-spacing:3px;outline:none}
input:focus{border-color:var(--acc)}
button{width:100%;height:50px;margin-top:12px;background:var(--acc);color:#1a1408;border:0;border-radius:12px;
       font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.4}
.hint{color:var(--dim);font-size:12px;text-align:center;margin-top:12px;line-height:1.5}
.err{color:#e8785a;font-size:14px;text-align:center;margin-top:12px;min-height:20px}
.result{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;display:none}
.result b{display:block;font-size:19px;margin-bottom:6px}
.result span{color:var(--dim);font-size:13px}
</style>
</head>
<body>

<h1>RONIN</h1>
<p class="sub">Введи ФП с кассового чека и крути. Один чек — один прокрут.</p>

<div class="wrap">
<div class="pin"></div>
<svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
<g id="rotor">
<path d="M170,170 L170,10 A160,160 0 0,1 322.17,120.55 Z" fill="#2e6b57"/>
<path d="M170,170 L322.17,120.55 A160,160 0 0,1 264.05,299.44 Z" fill="#3a3566"/>
<path d="M170,170 L264.05,299.44 A160,160 0 0,1 120.55,322.17 Z" fill="#7a3f2c"/>
<path d="M170,170 L120.55,322.17 A160,160 0 0,1 17.83,219.45 Z" fill="#8a6520"/>
<path d="M170,170 L17.83,219.45 A160,160 0 0,1 17.83,120.55 Z" fill="#2b4f77"/>
<path d="M170,170 L17.83,120.55 A160,160 0 0,1 75.95,40.56 Z" fill="#46662a"/>
<path d="M170,170 L75.95,40.56 A160,160 0 0,1 140.02,12.83 Z" fill="#6d3050"/>
<path d="M170,170 L140.02,12.83 A160,160 0 0,1 170,10 Z" fill="#8a2f2f"/>
<g transform="rotate(36,170,170)"><text x="170" y="42" text-anchor="middle" font-size="12" fill="#f0ece6">Час на PS5</text></g>
<g transform="rotate(108,170,170)"><text x="170" y="42" text-anchor="middle" font-size="12" fill="#f0ece6">100 рублей</text><text x="170" y="58" text-anchor="middle" font-size="11" fill="#cfc7bd">на счёт</text></g>
<g transform="rotate(171,170,170)"><text x="170" y="42" text-anchor="middle" font-size="12" fill="#f0ece6">Любимая</text><text x="170" y="58" text-anchor="middle" font-size="11" fill="#cfc7bd">газировка</text></g>
<g transform="rotate(225,170,170)"><text x="170" y="42" text-anchor="middle" font-size="12" fill="#f0ece6">Чайник</text><text x="170" y="58" text-anchor="middle" font-size="11" fill="#cfc7bd">чая</text></g>
<g transform="rotate(270,170,170)"><text x="170" y="46" text-anchor="middle" font-size="12" fill="#f0ece6">Чипсы</text></g>
<g transform="rotate(306,170,170)"><text x="170" y="46" text-anchor="middle" font-size="12" fill="#f0ece6">Энергетик</text></g>
<g transform="rotate(336.6,170,170)"><text x="170" y="40" text-anchor="middle" font-size="10" fill="#f0ece6">500 бонусов</text></g>
<g transform="rotate(354.6,170,170)"><text x="170" y="40" text-anchor="middle" font-size="9" fill="#f0ece6">Кальян</text></g>
<circle cx="170" cy="170" r="34" fill="#12100e" stroke="#c9a227" stroke-width="1.5"/>
<text x="170" y="175" text-anchor="middle" font-size="13" fill="#c9a227" letter-spacing="1">RONIN</text>
</g>
</svg>
</div>

<div class="panel">
  <div id="form">
    <input id="fp" type="tel" inputmode="numeric" maxlength="10" placeholder="ФП с чека">
    <button id="go">Крутить</button>
    <p class="hint">ФП — число внизу чека рядом с буквами ФП или ФПД.</p>
    <p class="err" id="err"></p>
  </div>
  <div class="result" id="result">
    <b id="rname"></b>
    <span id="rexp"></span>
    <p class="hint">Приз сохранён в чате с ботом. Открой «Мои призы», когда придёшь.</p>
  </div>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyrSmZXTJTHzP_WpN-gTIFOKb1KveGQl1WFMQpBZ4lYPxPU8-7UqpnyQN2JnhL1ADIT/exec';

var MID = [36, 108, 171, 225, 270, 306, 336.6, 354.6];
var SPAN = [72, 72, 54, 54, 36, 36, 25.2, 10.8];

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

var turns = 0, busy = false;

function jsonp(url) {
  return new Promise(function (resolve, reject) {
    var cb = 'cb' + Date.now();
    var s = document.createElement('script');
    var t = setTimeout(function () { cleanup(); reject(new Error('timeout')); }, 20000);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = function (data) { cleanup(); resolve(data); };
    s.src = url + '&callback=' + cb;
    s.onerror = function () { cleanup(); reject(new Error('network')); };
    document.body.appendChild(s);
  });
}

function spinTo(i) {
  var jitter = (Math.random() * 2 - 1) * (SPAN[i] / 2 - 2);
  turns += 6;
  document.getElementById('rotor').style.transform =
    'rotate(' + (turns * 360 + (360 - MID[i]) - jitter) + 'deg)';
}

document.getElementById('go').onclick = function () {
  if (busy) return;
  var fp = document.getElementById('fp').value.replace(/\D/g, '');
  var err = document.getElementById('err');
  err.textContent = '';

  if (!/^\d{6,10}$/.test(fp)) { err.textContent = 'ФП — от 6 до 10 цифр.'; return; }
  if (!tg || !tg.initData) { err.textContent = 'Открой колесо через бота Ronin.'; return; }

  busy = true;
  this.disabled = true;
  this.textContent = 'Крутим…';

  jsonp(API + '?action=spin&fp=' + encodeURIComponent(fp) +
        '&initData=' + encodeURIComponent(tg.initData))
    .then(function (r) {
      if (!r.ok) {
        err.textContent = r.error || 'Что-то пошло не так.';
        busy = false;
        var b = document.getElementById('go');
        b.disabled = false; b.textContent = 'Крутить';
        return;
      }
      spinTo(r.index);
      setTimeout(function () {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        document.getElementById('form').style.display = 'none';
        document.getElementById('rname').textContent = r.prize;
        document.getElementById('rexp').textContent = 'Действует до ' + r.expires;
        document.getElementById('result').style.display = 'block';
      }, 5100);
    })
    .catch(function () {
      err.textContent = 'Нет связи с сервером. Попробуй ещё раз.';
      busy = false;
      var b = document.getElementById('go');
      b.disabled = false; b.textContent = 'Крутить';
    });
};
</script>
</body>
</html>
